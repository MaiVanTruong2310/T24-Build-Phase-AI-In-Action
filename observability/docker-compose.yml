services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.2.1}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        sed \
          -e "s|__PROMETHEUS_DEV_TARGET__|$${PROMETHEUS_DEV_TARGET}|g" \
          -e "s|__PROMETHEUS_PROD_TARGET__|$${PROMETHEUS_PROD_TARGET}|g" \
          /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time="$${PROMETHEUS_RETENTION:-15d}" \
          --web.enable-lifecycle \
          --web.enable-remote-write-receiver
    environment:
      PROMETHEUS_DEV_TARGET: ${PROMETHEUS_DEV_TARGET:?PROMETHEUS_DEV_TARGET is required}
      PROMETHEUS_PROD_TARGET: ${PROMETHEUS_PROD_TARGET:?PROMETHEUS_PROD_TARGET is required}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.3.2}
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki_data:/loki
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "${TELEMETRY_BIND_ADDRESS:-0.0.0.0}:3100:3100"
    restart: unless-stopped

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.7.2}
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - tempo_data:/var/tempo
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "${TELEMETRY_BIND_ADDRESS:-0.0.0.0}:4317:4317"
      - "${TELEMETRY_BIND_ADDRESS:-0.0.0.0}:4318:4318"
      - "127.0.0.1:3200:3200"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.5.2}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_LOG_MODE: console
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
