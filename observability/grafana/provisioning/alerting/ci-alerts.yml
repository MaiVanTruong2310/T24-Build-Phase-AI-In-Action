apiVersion: 1

groups:
  - orgId: 1
    name: CI pipeline alerts
    folder: AI20K Operations
    interval: 1m
    rules:
      - uid: ci-pipeline-failed
        title: CI pipeline failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: max_over_time(ci_pipeline_run_info{branch="main",event="push",conclusion="failure"}[10m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A production push workflow reported a failed final result in the last 10 minutes.
          description: Open the run URL label or the CI/CD dashboard and inspect the first failed job.
        labels: {severity: critical, service: ci}
        isPaused: false

      - uid: ci-production-slow
        title: Production pipeline exceeded 60 minutes
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: max_over_time(ci_pipeline_run_duration_seconds{branch="main",event="push"}[10m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [3600], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A production push workflow took longer than 60 minutes.
          description: Check runner queue time, dependency installation, and the longest job series on the CI/CD dashboard.
        labels: {severity: warning, service: ci}
        isPaused: false

      - uid: ci-pushgateway-down
        title: CI metrics Pushgateway unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: min(up{job="ci-pushgateway"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: Prometheus cannot scrape the CI metrics Pushgateway.
          description: Check the pushgateway container and the ci-pushgateway target in Prometheus.
        labels: {severity: warning, service: observability}
        isPaused: false
