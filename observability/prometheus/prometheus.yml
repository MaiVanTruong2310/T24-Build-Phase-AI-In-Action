global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ai20k-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["__PROMETHEUS_DEV_TARGET__"]
        labels:
          environment: development
      - targets: ["__PROMETHEUS_PROD_TARGET__"]
        labels:
          environment: production

  - job_name: ai20k-node
    static_configs:
      - targets: ["__NODE_EXPORTER_DEV_TARGET__"]
        labels:
          environment: development
      - targets: ["__NODE_EXPORTER_PROD_TARGET__"]
        labels:
          environment: production

  - job_name: ai20k-cadvisor
    static_configs:
      - targets: ["__CADVISOR_DEV_TARGET__"]
        labels:
          environment: development
      - targets: ["__CADVISOR_PROD_TARGET__"]
        labels:
          environment: production

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: ci-pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
