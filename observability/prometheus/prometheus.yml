global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ai20k-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["${PROMETHEUS_DEV_TARGET}"]
        labels:
          environment: development
      - targets: ["${PROMETHEUS_PROD_TARGET}"]
        labels:
          environment: production

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
