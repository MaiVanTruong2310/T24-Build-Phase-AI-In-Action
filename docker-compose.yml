services:
  backend:
    image: ${IMAGE_REPO:-ai20k-agent}:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai20k_app}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-ai20k}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ${APP_DATA_PATH:-./data}:/app/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai20k}
      POSTGRES_USER: ${POSTGRES_USER:-ai20k_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ai20k_app} -d ${POSTGRES_DB:-ai20k}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db-migrate:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: "no"

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-ai20k-postgres}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-ai20k-redis}

networks:
  default:
    driver: bridge
