services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: ${IMAGE_REPO:-ai20k-agent}:${IMAGE_TAG:-local}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ${APP_DATA_PATH:-./data}:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai20k}
      POSTGRES_USER: ${POSTGRES_USER:-ai20k_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai20k_app} -d ${POSTGRES_DB:-ai20k}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-ai20k-postgres}