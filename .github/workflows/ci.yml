name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE: ${{ vars.DOCKERHUB_REPO }}

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          JWT_SECRET_KEY: test-secret-key-with-at-least-32-bytes

      - name: Build Docker image
        run: docker build --tag ai20k-agent:ci .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then ENV_TAG=production; else ENV_TAG=development; fi
          docker tag ai20k-agent:ci "$IMAGE:$GITHUB_SHA"
          docker tag ai20k-agent:ci "$IMAGE:$ENV_TAG"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$ENV_TAG"

      - name: Docker logout
        if: always() && github.event_name == 'push'
        run: docker logout
