name: CD

on:
  # Merge PR tạo ra một push vào nhánh đích. CI chạy (và push image) cho commit đó,
  # workflow này chỉ deploy sau khi CI thành công.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false # không huỷ deploy đang chạy dở

jobs:
  deploy:
    name: Deploy to ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'development' }} EC2
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'development' }}
    env:
      EC2_HOST: ${{ github.event.workflow_run.head_branch == 'main' && secrets.EC2_HOST_PROD || secrets.EC2_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      REMOTE_USER: ubuntu
      DEPLOY_ENV: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'development' }}
      COMPOSE_OVERRIDE: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'dev' }}
      IMAGE_REPO: ${{ vars.DOCKERHUB_REPO }}
      RELEASE_ID: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose files
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes"
          ssh $SSH_OPTS "$REMOTE_USER@$EC2_HOST" \
            "mkdir -p ~/ai20k-agent/releases/$RELEASE_ID"
          scp $SSH_OPTS \
            docker-compose.yml "docker-compose.${COMPOSE_OVERRIDE}.yml" \
            "$REMOTE_USER@$EC2_HOST:ai20k-agent/releases/$RELEASE_ID/"

      - name: Deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$REMOTE_USER@$EC2_HOST" bash -s -- \
            "$RELEASE_ID" "$DEPLOY_ENV" "$COMPOSE_OVERRIDE" "$IMAGE_REPO" <<'REMOTE_SCRIPT'
          set -euo pipefail

          RELEASE_ID="$1"
          DEPLOY_ENV="$2"
          COMPOSE_OVERRIDE="$3"
          IMAGE_REPO="$4"

          APP_DIR="$HOME/ai20k-agent"
          RELEASE_DIR="$APP_DIR/releases/$RELEASE_ID"

          test -f "$APP_DIR/.env" || {
            echo "Missing $APP_DIR/.env. Create the environment file on this EC2 instance first."
            exit 1
          }
          mkdir -p "$APP_DIR/data"

          PREV_TAG=$(cat "$APP_DIR/.current_tag" 2>/dev/null || true)

          export IMAGE_REPO
          export IMAGE_TAG="$RELEASE_ID"
          export APP_ENV_FILE="$APP_DIR/.env"
          export APP_DATA_PATH="$APP_DIR/data"
          export APP_ENV="$DEPLOY_ENV"

          compose() {
            docker compose \
              --project-name ai20k-agent \
              --env-file "$APP_DIR/.env" \
              --file "$RELEASE_DIR/docker-compose.yml" \
              --file "$RELEASE_DIR/docker-compose.${COMPOSE_OVERRIDE}.yml" \
              "$@"
          }

          echo ">> Pull ${IMAGE_REPO}:${IMAGE_TAG}"
          compose pull backend

          echo ">> Start services"
          compose up -d --no-build --remove-orphans

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              echo
              echo "$RELEASE_ID" > "$APP_DIR/.current_tag"
              ln -sfn "$RELEASE_DIR" "$APP_DIR/current"
              # Giữ lại 5 release gần nhất, dọn image dangling
              ls -1dt "$APP_DIR"/releases/* | tail -n +6 | xargs -r rm -rf
              docker image prune -f >/dev/null
              echo "Deploy OK: $RELEASE_ID"
              exit 0
            fi
            sleep 3
          done

          echo "Health check FAILED"
          compose logs --tail=100 || true

          if [ -n "$PREV_TAG" ]; then
            echo ">> Rollback về $PREV_TAG"
            IMAGE_TAG="$PREV_TAG" compose up -d --no-build backend
          fi
          exit 1
          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
