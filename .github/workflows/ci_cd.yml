name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE: ${{ vars.DOCKERHUB_REPO }}

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          JWT_SECRET_KEY: test-secret-key-with-at-least-32-bytes

      - name: Build Docker image
        run: docker build --tag ai20k-agent:ci .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then ENV_TAG=production; else ENV_TAG=development; fi
          docker tag ai20k-agent:ci "$IMAGE:$GITHUB_SHA"
          docker tag ai20k-agent:ci "$IMAGE:$ENV_TAG"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$ENV_TAG"

      - name: Docker logout
        if: always() && github.event_name == 'push'
        run: docker logout

  frontend_detection:
    name: Detect frontend
    runs-on: self-hosted
    outputs:
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend source
        id: detect
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend_check:
    name: Lint and build frontend
    needs: frontend_detection
    if: needs.frontend_detection.outputs.has_frontend == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ github.ref_name == 'main' && secrets.API_DOMAIN_PROD || secrets.API_DOMAIN_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  frontend_deploy:
    name: Deploy frontend to Vercel
    needs: [lint-and-test, frontend_detection, frontend_check]
    if: >-
      github.event_name == 'push' &&
      needs.frontend_detection.outputs.has_frontend == 'true' &&
      needs.frontend_check.result == 'success'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      VITE_API_BASE_URL: ${{ github.ref_name == 'main' && secrets.API_DOMAIN_PROD || secrets.API_DOMAIN_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID secret"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID secret"; exit 1; }
          test -n "$VITE_API_BASE_URL" || { echo "Missing API_DOMAIN_PROD/API_DOMAIN_DEV secret"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Build Vercel deployment
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt frontend
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            DEPLOY_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
            vercel alias set "$DEPLOY_URL" ai20k-build-phase-dev.vercel.app --token="$VERCEL_TOKEN"
          fi

  backend_deploy:
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ github.ref_name == 'main' && secrets.EC2_HOST_PROD || secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,docker-compose.dev.yml"
          target: "/opt/app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && secrets.EC2_HOST_PROD || secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA,GITHUB_REF_NAME
          script: |
            set -euo pipefail
            cd /opt/app

            if [ "$GITHUB_REF_NAME" = "main" ]; then
              OVERRIDE=docker-compose.prod.yml
              ENV_TAG=production
              FRONTEND_ORIGIN="${{ vars.FRONTEND_PROD_URL || 'https://ai20k-build-phase.vercel.app' }}"
            else
              OVERRIDE=docker-compose.dev.yml
              ENV_TAG=development
              FRONTEND_ORIGIN="${{ vars.FRONTEND_DEV_URL || 'https://ai20k-build-phase-dev.vercel.app' }}"
            fi

            cat > .env <<EOF
            IMAGE_REPO=${{ vars.DOCKERHUB_REPO }}
            IMAGE_TAG=${GITHUB_SHA}
            APP_ENV=${ENV_TAG}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_ALGORITHM=HS256
            JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
            JWT_REFRESH_TOKEN_EXPIRE_DAYS=30
            OTP_EXPIRE_MINUTES=5
            OTP_MAX_ATTEMPTS=5
            # TEMPORARY DEMO ONLY: remove when real OTP delivery is enabled.
            MOCK_OTP_CODE=123456
            CORS_ORIGINS=http://localhost:5173,${FRONTEND_ORIGIN}
            POSTGRES_DB=${{ vars.POSTGRES_DB || 'ai20k' }}
            POSTGRES_USER=${{ vars.POSTGRES_USER || 'ai20k_app' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=postgresql+psycopg://${{ vars.POSTGRES_USER || 'ai20k_app' }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ vars.POSTGRES_DB || 'ai20k' }}
            LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}
            LANGCHAIN_PROJECT=ai20k-agent
            LANGCHAIN_TRACING_V2=true
            AI_LOG_SERVER=https://ai-logs.note.transformerlabs.ai/api/ingest
            AI_LOG_API_KEY=${{ secrets.AI_LOG_API_KEY }}
            AI_LOG_DIR=.ai-log
            EOF
            chmod 600 .env

            docker compose -f docker-compose.yml -f "$OVERRIDE" pull
            docker compose -f docker-compose.yml -f "$OVERRIDE" up -d --remove-orphans

            # đợi healthcheck rồi dọn image cũ
            sleep 15
            docker compose -f docker-compose.yml -f "$OVERRIDE" ps
            docker image prune -f
