name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE: ${{ vars.DOCKERHUB_REPO }}

jobs:
  lint-and-test:
    runs-on: self-hosted
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ai20k_test
          POSTGRES_USER: ai20k_test
          POSTGRES_PASSWORD: ai20k_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ai20k_test -d ai20k_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --retries 10 --timeout 120 -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          JWT_SECRET_KEY: test-secret-key-with-at-least-32-bytes
          DATABASE_URL: postgresql+psycopg://ai20k_test:ai20k_test@localhost:${{ job.services.postgres.ports[5432] }}/ai20k_test
          # DATABASE_URL: $ {{secrets.DATABASE_URL}}
          DATABASE_AUTO_CREATE: "false"

      - name: Run Core & Benchmark Tests
        env:
          APP_ENV: test
          DEEPSEEK_API_KEY: test-key
          OPENAI_API_KEY: test-key
          JWT_SECRET_KEY: test-secret-key-with-at-least-32-bytes
          DATABASE_URL: postgresql+psycopg://ai20k_test:ai20k_test@localhost:5432/ai20k_test
          DATABASE_AUTO_CREATE: "false"
          INFO_AGENT_ENABLED: "false"
        run: |
          pytest tests/test_catalog/ \
                 tests/test_clinical_fact_collision_prevention.py \
                 tests/test_hybrid_dialogue_v2_safety_benchmark.py \
                 tests/agent/ \
                 tests/test_medical_assistant/ \
                 -v -ra --tb=short

      - name: Build Docker image
        run: docker build --tag ai20k-agent:ci .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then ENV_TAG=production; else ENV_TAG=development; fi
          docker tag ai20k-agent:ci "$IMAGE:$GITHUB_SHA"
          docker tag ai20k-agent:ci "$IMAGE:$ENV_TAG"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$ENV_TAG"

      - name: Docker logout
        if: always() && github.event_name == 'push'
        run: docker logout

  frontend_detection:
    name: Detect frontend
    runs-on: self-hosted
    outputs:
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend source
        id: detect
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend_check:
    name: Lint and build frontend
    needs: frontend_detection
    if: needs.frontend_detection.outputs.has_frontend == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ github.ref_name == 'main' && secrets.API_DOMAIN_PROD || secrets.API_DOMAIN_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run Chat & Coordinator Regression Tests
        run: |
          node tests/coordinator-session-chat.cjs
          node tests/chat-regression.cjs

      - name: Build frontend
        run: npm run build

  frontend_deploy:
    name: Deploy frontend to Vercel
    needs: [lint-and-test, frontend_detection, frontend_check]

    if: >-
      github.event_name == 'push' &&
      needs.frontend_detection.outputs.has_frontend == 'true' &&
      needs.frontend_check.result == 'success'

    runs-on: self-hosted

    defaults:
      run:
        working-directory: frontend

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      VITE_API_BASE_URL: ${{ github.ref_name == 'main' && secrets.API_DOMAIN_PROD || secrets.API_DOMAIN_DEV }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Node environment
        run: |
          node --version
          npm --version
          npx --version

      - name: Configure npm cache
        run: |
          echo "npm_config_cache=${RUNNER_TEMP}/npm-cache" >> "$GITHUB_ENV"
          rm -rf "${RUNNER_TEMP}/npm-cache"
          mkdir -p "${RUNNER_TEMP}/npm-cache"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pull Vercel project settings
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull \
            --yes \
            --environment="$VERCEL_ENV" \
            --token="$VERCEL_TOKEN"

      - name: Build Vercel deployment
        working-directory: frontend
        shell: bash
        run: |
          echo "npm cache:"
          npm config get cache
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            npx vercel@latest build \
              --prod \
              --token="$VERCEL_TOKEN"
          else
            npx vercel@latest build \
              --token="$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt frontend
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then

            npx vercel@latest deploy \
              --prebuilt \
              --prod \
              --token="$VERCEL_TOKEN"

          else

            DEPLOY_URL=$(npx vercel@latest deploy \
              --prebuilt \
              --token="$VERCEL_TOKEN")

            echo "Preview deployed: $DEPLOY_URL"

            npx vercel@latest alias set \
              "$DEPLOY_URL" \
              ai20k-build-phase-dev.vercel.app \
              --token="$VERCEL_TOKEN"

          fi
  # DATABASE_URL=postgresql+psycopg://${{ vars.POSTGRES_USER || 'ai20k_app' }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ vars.POSTGRES_DB || 'ai20k' }}
  backend_deploy:
    needs: [lint-and-test, observability_deploy]
    if: github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ github.ref_name == 'main' && secrets.EC2_HOST_PROD || secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,docker-compose.dev.yml,docker-compose.observability.yml,observability/alloy/agent.alloy"
          target: "/opt/app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        env:
          OBSERVABILITY_LOKI_URL: ${{ secrets.OBSERVABILITY_LOKI_URL }}
          OBSERVABILITY_TEMPO_OTLP_ENDPOINT: ${{ secrets.OBSERVABILITY_TEMPO_OTLP_ENDPOINT }}
        with:
          host: ${{ github.ref_name == 'main' && secrets.EC2_HOST_PROD || secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA,GITHUB_REF_NAME,OBSERVABILITY_LOKI_URL,OBSERVABILITY_TEMPO_OTLP_ENDPOINT
          script: |
            set -euo pipefail
            cd /opt/app

            if [ "$GITHUB_REF_NAME" = "main" ]; then
              OVERRIDE=docker-compose.prod.yml
              ENV_TAG=production
              FRONTEND_ORIGIN="${{ secrets.FRONTEND_PROD_URL || 'https://ai20k-build-phase.vercel.app' }}"
            else
              OVERRIDE=docker-compose.dev.yml
              ENV_TAG=development
              FRONTEND_ORIGIN="${{ secrets.FRONTEND_DEV_URL || 'https://ai20k-build-phase-dev.vercel.app' }}"
            fi

            FRONTEND_ORIGIN="${FRONTEND_ORIGIN%/}"

            if [[ ! "$FRONTEND_ORIGIN" =~ ^https?://[^/]+$ ]]; then
              echo "Invalid frontend origin for CORS: $FRONTEND_ORIGIN"
              exit 1
            fi

            cat > .env <<EOF
            IMAGE_REPO=${{ vars.DOCKERHUB_REPO }}
            IMAGE_TAG=${GITHUB_SHA}
            APP_ENV=${ENV_TAG}
            VITE_API_BASE_URL=${{ github.ref_name == 'main' && secrets.API_DOMAIN_PROD || secrets.API_DOMAIN_DEV }}
            AUTH_COOKIE_SAMESITE=none
            AUTH_COOKIE_SECURE=true
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_ALGORITHM=HS256
            JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
            JWT_REFRESH_TOKEN_EXPIRE_DAYS=30
            OTP_EXPIRE_MINUTES=5
            OTP_MAX_ATTEMPTS=5
            MOCK_OTP_CODE=123456
            CORS_ORIGINS=http://localhost:5173,${FRONTEND_ORIGIN},https://c4-app-t124-dev.vercel.app,https://c4-app-t124.vercel.app
            METRICS_ENABLED=true
            METRICS_BIND_ADDRESS=0.0.0.0
            METRICS_PORT=8001
            OBSERVABILITY_ENVIRONMENT=${ENV_TAG}
            OTEL_ENABLED=true
            OTEL_SERVICE_NAME=ai20k-backend
            OTEL_ENVIRONMENT=${ENV_TAG}
            LOKI_URL=${OBSERVABILITY_LOKI_URL}
            TEMPO_OTLP_ENDPOINT=${OBSERVABILITY_TEMPO_OTLP_ENDPOINT}
            POSTGRES_DB=${{ vars.POSTGRES_DB || 'ai20k' }}
            POSTGRES_USER=${{ vars.POSTGRES_USER || 'ai20k_app' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=${{secrets.DATABASE_URL}}
            LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}
            LANGCHAIN_PROJECT=ai20k-agent
            LANGCHAIN_TRACING_V2=true
            AI_LOG_SERVER=https://ai-logs.note.transformerlabs.ai/api/ingest
            AI_LOG_API_KEY=${{ secrets.AI_LOG_API_KEY }}
            AI_LOG_DIR=.ai-log
            SUPABASE_URL=${{secrets.SUPABASE_URL}}
            SUPABASE_KEY=${{secrets.SUPABASE_KEY}}
            EOF

            chmod 600 .env

            COMPOSE_FILES=(-f docker-compose.yml -f "$OVERRIDE" -f docker-compose.observability.yml)

            docker compose "${COMPOSE_FILES[@]}" config >/dev/null
            docker compose "${COMPOSE_FILES[@]}" pull
            docker compose "${COMPOSE_FILES[@]}" up -d postgres
            docker compose "${COMPOSE_FILES[@]}" up -d --remove-orphans

            sleep 45

            docker compose "${COMPOSE_FILES[@]}" ps

            CORS_HEADERS=$(curl -sS -D - -o /dev/null -X OPTIONS \
              http://127.0.0.1:8000/api/v1/users/me \
              -H "Origin: $FRONTEND_ORIGIN" \
              -H "Access-Control-Request-Method: GET" \
              -H "Access-Control-Request-Headers: authorization")

            if ! printf '%s\n' "$CORS_HEADERS" \
              | grep -Fqi "access-control-allow-origin: $FRONTEND_ORIGIN"; then

              echo "CORS preflight failed for $FRONTEND_ORIGIN"
              printf '%s\n' "$CORS_HEADERS"
              exit 1
            fi

            docker image prune -f

  observability_deploy:
    name: Deploy observability EC2
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: self-hosted
    env:
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.OBSERVABILITY_GRAFANA_ADMIN_PASSWORD }}
      PROMETHEUS_DEV_TARGET: ${{ secrets.OBSERVABILITY_DEV_TARGET }}
      PROMETHEUS_PROD_TARGET: ${{ secrets.OBSERVABILITY_PROD_TARGET }}
      GRAFANA_ROOT_URL: ${{ secrets.OBSERVABILITY_GRAFANA_ROOT_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate observability deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in GRAFANA_ADMIN_PASSWORD PROMETHEUS_DEV_TARGET PROMETHEUS_PROD_TARGET GRAFANA_ROOT_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required observability setting: $name"
              exit 1
            fi
          done

      - name: Copy observability stack to monitoring EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OBSERVABILITY_EC2_HOST }}
          username: ${{ secrets.OBSERVABILITY_EC2_USER }}
          key: ${{ secrets.OBSERVABILITY_EC2_SSH_KEY }}
          source: "observability/*"
          target: "/opt/observability"
          strip_components: 1

      - name: Start observability stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OBSERVABILITY_EC2_HOST }}
          username: ${{ secrets.OBSERVABILITY_EC2_USER }}
          key: ${{ secrets.OBSERVABILITY_EC2_SSH_KEY }}
          envs: GRAFANA_ADMIN_PASSWORD,PROMETHEUS_DEV_TARGET,PROMETHEUS_PROD_TARGET,GRAFANA_ROOT_URL
          script: |
            set -euo pipefail
            cd /opt/observability

            cat > .env <<EOF
            PROMETHEUS_DEV_TARGET=${PROMETHEUS_DEV_TARGET}
            PROMETHEUS_PROD_TARGET=${PROMETHEUS_PROD_TARGET}
            GRAFANA_ADMIN_USER=admin
            GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            GRAFANA_ROOT_URL=${GRAFANA_ROOT_URL}
            GRAFANA_BIND_ADDRESS=0.0.0.0
            TELEMETRY_BIND_ADDRESS=0.0.0.0
            PROMETHEUS_RETENTION=15d
            EOF
            chmod 600 .env

            docker compose --env-file .env -f docker-compose.yml config >/dev/null
            docker compose --env-file .env -f docker-compose.yml pull
            docker compose --env-file .env -f docker-compose.yml up -d --remove-orphans

            sleep 15
            curl --fail --silent --show-error http://127.0.0.1:3000/api/health
            docker compose --env-file .env -f docker-compose.yml ps
            docker image prune -a -f --filter "until=168h"
            docker builder prune -a -f --filter "until=168h"
