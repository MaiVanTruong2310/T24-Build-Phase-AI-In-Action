services:
  backend:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai20k_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ai20k}

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai20k}
      POSTGRES_USER: ${POSTGRES_USER:-ai20k_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ai20k_app} -d ${POSTGRES_DB:-ai20k}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-ai20k-postgres}
