[project]
name = "medical-assistant"
version = "0.1.0"
description = "Vinmec Medical Assistant Agent System"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
